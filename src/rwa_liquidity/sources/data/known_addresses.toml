[[asset]]
uid = "ethereum:0x530824da86689c9c17cdc2871ff29b058345b44a"  # STBT
excluded_contracts = []
issuer_addresses = []
notes = """
Checked 2026-08-31. Rank-1 holder, 0xD9C7daF04da823ec604Ab88469DF0b6F4e4faC5b,
holds **~96% of STBT's entire supply** (23.3M of ~24.3M) -- consistent with,
and the direct explanation for, this asset's HHI of 9,369 in docs/findings.md
(near the 10,000 maximum). It carries no Etherscan name tag, but its
transaction history is unambiguous: an EOA (not a contract), "Funded By
Matrixport 5", whose only counterparty across its visible history is
"Matrixdock: STBT Token" -- Matrixdock being STBT's own issuer. Read together,
this is very likely Matrixdock's own institutional distribution wallet.

**Not confirmed as an issuer address, and deliberately left unconfigured.**
The distributor-signature check (mint from 0x0, then fan out) that confirmed
CANA's and CGT's issuer addresses does **not** confirm this one: queried via
Dune 2026-08-31, this address shows `mints_received = 0` -- every unit it
holds arrived via an ordinary transfer, not directly from the zero address --
while it has sent to 10 distinct recipients across 19 sends between
2023-09-26 and 2026-08-28 (3 days before this check). Since token conservation
means its balance must trace back to a real mint somewhere upstream, the
zero-address rule not firing here does not mean the address isn't an issuer
distributor; it means the mint-then-fan-out signature this file's search
relies on cannot see through an intermediate hop. Configuring it as an issuer
on circumstantial evidence (funding source, exclusive counterparty, no
contract code) alone would repeat exactly the error OUSG's rejected candidate
was kept out for. Left as a documented, unresolved risk instead: STBT's
extreme concentration figure is not an artifact needing correction (whoever
controls this address does appear to economically control ~96% of supply),
but whether transfers into or out of it since 2023 should have been
classified as primary is unresolved and unbounded here, unlike OUSG's
rejected candidate, which came with a 3-of-50 bound. Also not excluded from
`excluded_contracts`: it is an EOA, not a contract, so it does not fit that
mechanism's rationale either way.
"""

