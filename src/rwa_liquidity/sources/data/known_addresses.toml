    "0x93358db73b6cd4b98d89c8f5f230e81a95c2643a", # OUSG_InstantManager
    "0x2826989983e3a66f0622132d019c2ae173eb6a43", # OUSGInstantManager (legacy)
    "0x72be8c14b7564f7a61ba2f6b7e50d18dc1d4b63d", # OUSG Recipient, for manual redemptions
    "0xf16c188c2d411627d39655a60409ec6707d3d5e8", # OUSGManager (legacy)
    "0x3501883a646f1f8417bcb62162372550954d618f", # CashManager (legacy)
]
notes = """
Excluded: Flux Finance's fOUSG vault, a lending market that holds OUSG as
collateral for its depositors (about a quarter of supply).

Issuer addresses: the contracts Ondo lists for OUSG subscriptions and
