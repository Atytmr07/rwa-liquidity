[[asset]]
uid = "ethereum:0x917991d52aa2fc1b5612a6aa5e4e81d580f97532"  # ZTLN
excluded_contracts = [
    "0xBA12222222228d8Ba445958a75a0704d566BF2C8", # Balancer: Vault
]
issuer_addresses = []
notes = """
Checked 2026-09-01. ZTLN's headline figure everywhere in this project's
narrative docs (README, findings.md SS3, ssrn-working-paper.md SS3.2) is
"$150m supply, two holders, no trading in its entire history." One of those
two addresses, holding 100,011,201 of 150,000,000 ZTLN (66.7% of supply), is
Etherscan-labeled `Balancer: Vault` -- the shared vault contract behind every
Balancer V2 pool, confirmed by navigating directly to the address (page
title: "Balancer: Vault | Address: 0xba122222...d566bf2c8 | Etherscan"), not
inferred from balance size. This is the same address-versus-investor failure
mode as OUSG's Flux vault and USYC's Usual Treasury, in the one place this
project's own prose leaned on "two holders" as a headline claim rather than
a table entry -- the "bilateral arrangement" reading in findings.md SS3 is
therefore not quite right: one side is a DeFi pool contract, which could
represent zero LPs, one, or many behind it; this file cannot say which, only
that it is not itself an investor. The second holder (49,988,799 ZTLN, EOA,
no Etherscan label) is unaffected. Quantified impact (30-day window ending
2026-09-01, isolated on identical cached data): top-10 holder share
100.0% -> **33.3%**, HHI 5,556 -> **1,110.6**, dormancy 100.0% -> **33.3%**.

Every share-valued metric in this package divides by the token's full
reconstructed total supply, never by a re-summed total of the remaining
(post-exclusion) holders -- see `docs/methodology.md` SS2.4-2.6, which
had this backwards in an earlier draft and was corrected against this exact
case. So excluding the vault does not renormalize ZTLN down to "one investor,
therefore 100% concentrated": it correctly reports that only one-third of
total supply is confirmed to sit with an identified investor, and says
nothing about the other two-thirds rather than assuming it is either
maximally concentrated or perfectly diffuse. The exclusion does not soften
ZTLN's illiquidity finding -- the confirmed investor has still never traded
-- but it does soften the "no trading in its entire history" framing used in
README/findings.md SS3/ssrn-working-paper.md SS3.2: that is true of the
ZTLN token itself, but says nothing about whether Balancer LP shares
representing a claim on the pooled ZTLN have traded, which this method
cannot see. Both narrative claims should be corrected to distinguish "the
one confirmed investor never traded" from "nothing backed by this token has
ever traded," which is not established.
"""

