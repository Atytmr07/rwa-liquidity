uid = "ethereum:0x136471a34f6ef19fe571effc1ca711fdb8e49f2b"  # USYC
excluded_contracts = [
    "0xdd82875f0840aad58a455a70b88eed9f59cec7c7", # Etherscan: "Usual: Treasury"
]
issuer_addresses = []
notes = """
Rank-1 holder at ~46.5% of supply (23.5M of ~50.6M USYC) is "Usual: Treasury"
(a Safe-singleton proxy), Etherscan-labeled. Confirmed via Usual's own
documentation (docs.usual.money, checked 2026-08-31) rather than the label
alone: USYC is USD0's primary RWA collateral, held by Usual's DaoCollateral
mechanism to back USD0 1:1. This is the same aggregation pattern as OUSG's
Flux vault, at larger scale and one step more consequential -- the address
does not just pool depositors of a lending market, it backs an entire
stablecoin's circulating supply.

Quantified impact (30-day window ending 2026-09-01, isolated on identical
cached data, exclude toggled with everything else held fixed): top-10 holder
share 99.997% → 68.254%, HHI 2,507.0 → 1,499.3. Dormancy is unchanged
(61.176% either way): the Treasury address is in continuous use backing
DaoCollateral, so it was never counted among the dormant addresses to begin
with -- excluding it moves concentration, not dormancy.

Rank 3 is "Deribit 16" (an exchange address) and rank 1's implementation is a
Gnosis Safe; neither is excluded -- an exchange's own balance sheet and a
single multisig are each one economic entity under the same reading applied
to OUSG's Safe-held holders, not a pooling contract. issuer_addresses is
empty: no distributor-signature search has been run for USYC yet.
"""

