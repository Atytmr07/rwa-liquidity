# Mapping from canonical asset keys to DeFiLlama protocol slugs.
#
# ## Why this file is maintained by hand
#
# DeFiLlama's own `address` field cannot be used to derive it:
#
#   * 90 of the 153 protocols in the RWA category have no address at all.
#   * Where an address is present the format is inconsistent: sometimes bare
#     (`0x4580...`), sometimes chain-prefixed with a DeFiLlama-specific alias
#     (`era:0x57fD...`), with no field saying which.
#   * **The address usually identifies a governance token rather than a tokenized
#     asset.** Of the 40 distinct Ethereum addresses filed under the RWA category,
#     roughly three quarters resolve on-chain to a protocol's own governance or
#     utility token: ONDO, CFG, ENA, FXS, USUAL, SKY, CPOOL, SYRUP, NAOS, LNDX,
#     STBU, SOLV and others. Those are equity in an issuer, not the instrument the
#     issuer tokenized, and measuring their liquidity answers a different question.
#
# ## How the entries below were selected
#
# A reproducible procedure, not a hand-picked list:
#
#   1. Take every protocol DeFiLlama files under category `RWA`.
#   2. Extract the Ethereum addresses, handling both formats.
#   3. Resolve each on-chain with `eth_call`. The contract's own `symbol()`,
#      `name()` and `decimals()` decide what it is; DeFiLlama's label does not.
#   4. Count the full `Transfer` history to check that exhaustive holder
#      reconstruction is affordable.
#   5. Keep the entries whose on-chain `name()` identifies a **tokenized asset**
#      -- a fund, note, bond, or commodity claim -- and discard governance tokens.
#
# Step 5 is a judgement, and it is the only one. It is made from the contract's
# own name, which is recorded in each entry's `notes` so the call can be checked.
#
# Verified on-chain 2026-07-30, with five further entries added 2026-08-27 from
# a second pass over the same category (see the block preceding them). `supply`
# and `logs` in the notes are as of the date each entry names and will drift;
# they are there to show the order of magnitude, not as assertions about the
# present.

schema_version = 1

