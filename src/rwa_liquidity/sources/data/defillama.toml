# --- added 2026-08-27, second pass over the RWA category -------------------
#
# The five entries below were resolved by the same procedure as the originals
# (steps 1-5 above), re-run against DeFiLlama's current RWA category. They are
# here to answer a specific objection to the first pass: that a sample in which
# four of ten assets never traded might be measuring the method's reach rather
# than the market, since the assets thin enough to scan exhaustively could be
# exactly the ones with no secondary market to find.
#
# Two candidates from this pass were **excluded for exceeding the scan ceiling**,
# and the exclusions are the informative part: Ethena's USDtb (~450,000 logs
# estimated) and Usual's USD0 (~475,000). Both are DeFi-native and heavily
# traded -- precisely the profile that would most enrich the sample, and
# precisely what a free public endpoint cannot reconstruct. That is the same
# boundary PAXG and XAUt sit on, met again with different assets.

