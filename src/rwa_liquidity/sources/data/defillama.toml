# Mapping from canonical asset keys to DeFiLlama protocol slugs.
#
# This file is maintained by hand, which is a deliberate choice rather than a
# gap. DeFiLlama's own `address` field cannot be used to derive it:
#
#   * 90 of the 153 protocols in the RWA category have no address at all.
#   * Where an address is present it is sometimes bare (`0x4580...`) and
#     sometimes chain-prefixed with a DeFiLlama-specific alias
#     (`era:0x57fD...`), with no field saying which.
#   * The address often points at the wrong token entirely. `ondo-yield-assets`
#     reports `0xfaba6f8e...`, which resolves to ONDO, Ondo's governance token,
#     not to any tokenized treasury product the protocol issues. The same
#     address is reported for `ondo-global-markets`.
#
# Guessing from that field would produce metrics for the wrong asset while
# looking entirely successful, so the mapping is stated explicitly instead.
#
# Every entry below was verified against the live API on 2026-07-29: the `uid`
# resolves on coins.llama.fi to the stated `symbol`, and `defillama_slug`
# resolves on api.llama.fi to a protocol whose chainTvls contains
# `defillama_chain`.

schema_version = 1

[[asset]]
uid = "ethereum:0x7712c34205737192402172409a8f7ccef8aa2aec"
symbol = "BUIDL"
name = "BlackRock USD Institutional Digital Liquidity Fund"
defillama_slug = "blackrock-buidl"
defillama_chain = "Ethereum"
notes = """
The protocol is multi-chain; only the Ethereum share is taken. The protocol also \
covers a second share class, BUIDL-I, so the protocol TVL exceeds the value of \
this contract alone."""

[[asset]]
uid = "ethereum:0x45804880de22913dafe09f4980848ece6ecbaf78"
symbol = "PAXG"
name = "Paxos Gold"
defillama_slug = "paxos-gold"
defillama_chain = "Ethereum"
notes = """
Single-chain and single-token, so the protocol TVL and the contract's value \
should agree closely. This makes it the most useful entry for validating the \
reconciliation logic itself."""

[[asset]]
uid = "ethereum:0x68749665ff8d2d112fa859aa293f07a622782f38"
symbol = "XAUT"
name = "Tether Gold"
defillama_slug = "tether-gold"
defillama_chain = "Ethereum"
notes = """
DeFiLlama reports this symbol lowercase as `xaut` while reporting others \
uppercase. Symbols are passed through as the source reports them rather than \
being normalized, so this inconsistency is visible in the output."""

[[asset]]
uid = "ethereum:0x1b19c19393e2d034d8ff31ff34c81252fcbbee92"
symbol = "OUSG"
name = "Ondo Short-Term US Government Treasuries"
defillama_slug = "ondo-yield-assets"
defillama_chain = "Ethereum"
notes = """
Known imprecision: OUSG has no protocol slug of its own. `ondo-yield-assets` is \
an umbrella covering USDY and other products, so its TVL is an upper bound on \
OUSG rather than a measurement of it. Reconciliation against this entry should \
be expected to disagree, and the disagreement is informative rather than a bug."""
