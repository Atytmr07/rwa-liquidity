# Registry: the measured assets and their DeFiLlama protocol slugs.
#
# The mapping is maintained by hand because DeFiLlama's own `address` field
# cannot be used to derive it. Most protocols in the RWA category have no
# address, the format varies between bare and chain-prefixed addresses, and
# most listed Ethereum addresses resolve to a protocol's governance or utility
# token rather than to the tokenized asset.
#
# Selection procedure:
#
#   1. Take every protocol DeFiLlama files under category `RWA`.
#   2. Extract the Ethereum addresses.
#   3. Resolve each on-chain with `eth_call`; the contract's own `symbol()`,
#      `name()` and `decimals()` identify it, not DeFiLlama's label.
#   4. Keep the contracts whose on-chain `name()` identifies a tokenized asset
#      (a fund, note, bond or commodity claim) and discard governance tokens.
#
# Each entry's notes record the on-chain name and any imprecision in the
# DeFiLlama mapping.

schema_version = 1

