[project]
name = "rwa-liquidity"
version = "0.1.0"
description = "Measure liquidity in tokenized real-world asset (RWA) markets from multiple data sources, with reproducible metrics and full provenance."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Atay Tümer", email = "atytmr07@gmail.com" }]
keywords = [
    "rwa",
    "tokenization",
    "liquidity",
    "market-microstructure",
    "blockchain",
    "defi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]

dependencies = [
    "polars>=1.17",
    "pandera[polars]>=0.22",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    # Parquet read/write backend for the cache layer. polars vendors its own
    # reader, but pyarrow is required for the round-trip guarantees we rely on
    # (stable schema metadata) and for the pandas export path.
    "pyarrow>=18.0",
]

[project.optional-dependencies]
# pandas is deliberately NOT a core dependency. The package is polars-first;
# pandas exists only at the export boundary for users who want a pandas frame
# back. Keeping it an extra makes that boundary impossible to cross by accident.
pandas = ["pandas>=2.2"]

[project.urls]
Homepage = "https://github.com/atytmr07/rwa-liquidity"
Repository = "https://github.com/atytmr07/rwa-liquidity"
Issues = "https://github.com/atytmr07/rwa-liquidity/issues"

[project.scripts]
rwa-liquidity = "rwa_liquidity.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rwa_liquidity"]


# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez -- timezone-naive datetimes are a real hazard
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint
    "RUF",    # ruff-specific
    "D",      # pydocstyle -- this package's docstrings are user-facing methodology
    "ANN",    # flake8-annotations
    "S",      # flake8-bandit
]
ignore = [
    "D203",   # conflicts with D211 (no blank line before class docstring)
    "D213",   # conflicts with D212 (summary on first line)
    "ANN401", # Any is occasionally correct at adapter boundaries
]

[tool.ruff.lint.per-file-ignores]
# The default fetch methods raise rather than using their arguments. The
# parameters are the interface: they define the signature every adapter that
# does implement the capability must match.
"src/rwa_liquidity/sources/base.py" = ["ARG002"]
"tests/**" = [
    "S101",   # assert is the point of a test
    "D",      # test names carry the documentation
    "PLR2004", # magic numbers are the expected values in hand-computed fixtures
]

[tool.ruff.lint.pydocstyle]
convention = "google"


# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true
warn_unused_ignores = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# pandera ships type information but its polars backend is younger than the
# pandas one and does not yet type-check cleanly under --strict. Scoped to the
# one library rather than relaxing strictness globally.
module = ["pandera.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
# pyarrow ships no py.typed marker and no stubs. It is used in exactly one place
# (the cache's parquet metadata round trip), so the untyped surface is small and
# bounded rather than spread through the package.
module = ["pyarrow.*"]
ignore_missing_imports = true


# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "network: test performs a real network call (deselected by default in CI)",
]
filterwarnings = [
    # Warnings are errors: a DeprecationWarning from a data library is usually
    # the first sign that a computation is about to start meaning something
    # different, which is not something this package can afford to miss.
    "error",
    # pandera 0.32.1 builds its failure-case table with pl.concat(how="horizontal"),
    # whose default behaviour polars deprecated in 1.42.1. The call is inside
    # pandera, not this package, and it fires on every validation error -- which
    # would make every schema test fail for a reason unrelated to the schema.
    # Remove once pandera ships a release built against polars >= 1.42.1.
    "ignore:the default behavior of .*concat.* is deprecated:DeprecationWarning",
]


# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/rwa_liquidity"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
