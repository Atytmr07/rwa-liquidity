name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first; there is no value in
# paying for CI on a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fail loudly instead of silently falling back to a system interpreter.
  UV_PYTHON_DOWNLOADS: automatic

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of the supported range on Linux, plus the
        # floor on Windows. Not a full OS x version cross product -- that
        # doubles every job for coverage this project doesn't need, since the
        # risk a second OS actually catches is platform-specific dependency
        # resolution (see the 2026-08-15 tzdata entry in DECISIONS.md: a
        # dependency that arrived only as a side effect of an extra, invisible
        # on Linux because the OS supplies what it was standing in for), not
        # interpreter-version behaviour. One Windows job catches that class of
        # bug; a second one on 3.13 would not catch a different class of it.
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}

      - name: pytest
        # Tests marked `network` hit live third-party APIs and are excluded so
        # that CI never fails because someone else's service is down.
        run: >
          uv run --python ${{ matrix.python-version }}
          pytest -m "not network"
          --cov --cov-report=term-missing
